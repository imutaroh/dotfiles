onboarding = false

[keys]
# プレフィックスキー: ctrl+q を押してから各キーを押す（tmux の ctrl+b 相当）
prefix = "ctrl+q"

# ─── 基本 ───
help = "prefix+?"              # キーバインド一覧を表示（迷ったらこれ）
settings = "prefix+s"          # 設定画面
detach = "prefix+d"            # セッションから抜ける（サーバは生きたまま）
reload_config = "prefix+shift+r"

# ─── ワークスペース ───
workspace_picker = "prefix+w"  # ワークスペース一覧から選ぶ
navigate_workspace_down = "j"  # picker 内を vim 風に移動（デフォルトは矢印のみ）
navigate_workspace_up = "k"
goto = "prefix+g"              # なんでもジャンプ
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"

# ─── タブ ───
new_tab = "prefix+c"           # 新しいタブ（tmux と同じ c）
rename_tab = "prefix+shift+t"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"     # ctrl+q → 数字 でタブ切替
close_tab = "prefix+shift+x"

# ─── ペイン（分割） ───
split_vertical = "prefix+v"    # 左右に分割
split_horizontal = "prefix+minus" # 上下に分割
focus_pane_left = "prefix+h"   # vim 風に h/j/k/l で移動
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
zoom = "prefix+z"              # ペインを最大化/戻す
last_pane = "prefix+m"         # 直前のペインとトグル（Cmd+P から呼ぶ。エディタ⇔AI の一撃往復用）
resize_mode = "prefix+r"       # リサイズモード
close_pane = "prefix+x"

# ─── エージェント ───
next_agent = "prefix+a"        # agent パネル順で次のエージェントへ（A = Agent）
previous_agent = "prefix+shift+a" # 前のエージェントへ

# ─── その他 ───
toggle_sidebar = "prefix+b"    # サイドバー開閉
edit_scrollback = "prefix+e"   # スクロールバックをエディタで開く
open_notification_target = "prefix+o"

# ─── ポップアップ（0.7.4〜のフローティングペイン） ───
# スクラッチシェルを画面中央に浮かせる（Cmd+P から呼ぶ）。exit / Ctrl+D で閉じる。
# 注意: popup 表示中は Esc 含む全入力を popup が受け取る（トグル非対応、閉じるにはプロセス終了）
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"

[ui.toast]
# エージェントが完了(idle)・入力待ち(blocked)になったら in-app popup を表示する。
# popup が出たら Cmd+O（= prefix+o / open_notification_target）でそのエージェントに直行できる。
# delivery: off(既定=無効) / herdr(アプリ内トースト) / terminal(端末経由の通知) / system(macOS通知)
delivery = "herdr"
# 状態変化からこの秒数待って、まだ同じ状態なら通知（一瞬の状態揺れを無視）
delay_seconds = 1

[ui.toast.herdr]
position = "top-right"

[worktrees]
# CLI で作るときは `herdr worktree create --path .claude/worktrees/<slug>` でリポ内に置くのが標準。
# ここはサイドバー（prefix+shift+g）から作った場合の保険で、~/.claude/worktrees/<repo>/<branch> に落とす。
directory = "~/.claude/worktrees"

[ui]
agent_panel_sort = "spaces"
